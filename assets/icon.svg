<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- LPN MasterGuide app icon: a glossy stepping stone with a nursing cross. Layer ids are used to
       render the separate Android adaptive-icon background and foreground. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0b1739"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
  </g>
  <g id="foreground">
    <circle cx="512" cy="530" r="270" fill="#38bdf8" opacity="0.55" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="270" fill="url(#stone)"/>
    <circle cx="512" cy="512" r="268" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6"/>
    <ellipse cx="512" cy="372" rx="200" ry="105" fill="url(#shine)"/>
    <path d="M462 352 h100 a14 14 0 0 1 14 14 v86 h86 a14 14 0 0 1 14 14 v100 a14 14 0 0 1 -14 14 h-86 v86 a14 14 0 0 1 -14 14 h-100 a14 14 0 0 1 -14 -14 v-86 h-86 a14 14 0 0 1 -14 -14 v-100 a14 14 0 0 1 14 -14 h86 v-86 a14 14 0 0 1 14 -14 z" fill="#ffffff"/>
  </g>
</svg>
